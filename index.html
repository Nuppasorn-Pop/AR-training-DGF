<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>AR Panda Mood — Hiro Marker</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif; background: #111827; }
    .hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    .top { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(94vw, 460px); padding: 12px 16px; border-radius: 17px; text-align: center; background: rgba(15,23,42,.78); color: white; box-shadow: 0 8px 28px #0004; }
    .top h1 { font-size: 17px; margin: 0 0 3px; }
    .top p { font-size: 12px; margin: 0; color: #dbeafe; }
    .controls { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 12px; justify-content: center; pointer-events: auto; width: 100%; padding: 0 10px; }
    button { appearance: none; min-width: 134px; padding: 15px 20px; border: 2px solid #ffffff80; border-radius: 18px; font-size: 17px; font-weight: 800; cursor: pointer; color: white; box-shadow: 0 6px 20px #0005; transition: transform .15s, filter .15s, outline-color .15s; }
    button:active { transform: scale(.96); }
    button[aria-pressed="true"] { outline: 3px solid white; outline-offset: 2px; filter: brightness(1.13); }
    #sadBtn { background: linear-gradient(135deg, #4969b5, #293b80); }
    #happyBtn { background: linear-gradient(135deg, #f59e0b, #ea580c); }
    .status { position: absolute; top: 103px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 99px; background: #0f172acc; color: #fff; font-size: 12px; text-align: center; max-width: 92vw; }
    .bottom-tip { position: absolute; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 80px); left: 50%; transform: translateX(-50%); font-size: 11px; color: white; text-shadow: 0 1px 4px black; white-space: nowrap; }
    .a-enter-vr { display: none !important; }
    @media (max-width: 380px) { button { min-width: 120px; padding: 13px; font-size: 15px; } }
  </style>
</head>
<body>
  <div class="hud">
    <div class="top"><h1>🐼 AR Panda Mood</h1><p>ส่องกล้องไปที่ Hiro Marker แล้วเลือกอารมณ์ของแพนด้า</p></div>
    <div id="status" class="status" role="status">กำลังเตรียมกล้อง…</div>
    <div class="bottom-tip">ใช้กล้องหลัง • วาง Marker บนพื้นราบและให้มีแสงสว่าง</div>
    <div class="controls">
      <button id="sadBtn" type="button" aria-pressed="false">🌧️ เศร้า</button>
      <button id="happyBtn" type="button" aria-pressed="true">🌈 มีความสุข</button>
    </div>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true; alpha: true; colorManagement: true" arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false; trackingMethod: best;" loading-screen="enabled: false">
    <a-assets>
      <a-mixin id="white" material="color: #fffdf4; roughness: 0.9"></a-mixin>
      <a-mixin id="black" material="color: #20252e; roughness: 0.9"></a-mixin>
    </a-assets>
    <a-marker id="hiro" preset="hiro" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.015" smoothThreshold="2">
      <!-- Scale the whole world to fit a Hiro marker while keeping details legible. -->
      <a-entity id="world" scale="0.62 0.62 0.62">
        <a-circle rotation="-90 0 0" position="0 0.015 0" radius="1.07" color="#b0e9ae" material="side: double; opacity: .88"></a-circle>
        <a-circle rotation="-90 0 0" position="0 0.022 0" radius=".84" color="#d3f4cb" material="side: double; opacity: .87"></a-circle>
        <a-entity id="pandaRig" position="0 0 0.12">
          <!-- Body, tummy and legs -->
          <a-sphere position="0 0.78 0" scale="0.51 0.68 0.42" mixin="white"></a-sphere>
          <a-sphere position="0 0.8 0.32" scale="0.37 0.48 0.15" mixin="white"></a-sphere>
          <a-sphere position="-0.29 0.28 0.08" scale="0.22 0.31 0.24" mixin="black"></a-sphere>
          <a-sphere position="0.29 0.28 0.08" scale="0.22 0.31 0.24" mixin="black"></a-sphere>
          <a-sphere position="-0.30 0.13 0.28" scale="0.24 0.13 0.31" mixin="black"></a-sphere>
          <a-sphere position="0.30 0.13 0.28" scale="0.24 0.13 0.31" mixin="black"></a-sphere>
          <!-- Arms separately animated by script -->
          <a-entity id="leftArm" position="-0.49 1.08 -0.02" rotation="0 0 -15">
            <a-sphere position="-0.07 -0.29 0.05" scale="0.19 0.39 0.21" mixin="black"></a-sphere>
          </a-entity>
          <a-entity id="rightArm" position="0.49 1.08 -0.02" rotation="0 0 15">
            <a-sphere position="0.07 -0.29 0.05" scale="0.19 0.39 0.21" mixin="black"></a-sphere>
          </a-entity>
          <!-- Head drops independently when sad -->
          <a-entity id="headPivot" position="0 1.32 0.04">
            <a-entity id="head" position="0 0.48 0.06">
              <a-sphere scale="0.53 0.50 0.43" mixin="white"></a-sphere>
              <a-sphere position="-0.38 0.38 -0.03" scale="0.18 0.22 0.15" mixin="black"></a-sphere>
              <a-sphere position="0.38 0.38 -0.03" scale="0.18 0.22 0.15" mixin="black"></a-sphere>
              <!-- Eye patches, white sparkling eyes -->
              <a-sphere position="-0.22 0.055 0.345" rotation="0 -18 -13" scale="0.185 0.24 0.065" mixin="black"></a-sphere>
              <a-sphere position="0.22 0.055 0.345" rotation="0 18 13" scale="0.185 0.24 0.065" mixin="black"></a-sphere>
              <a-sphere position="-0.21 0.07 0.404" scale="0.085 0.105 0.038" color="#fff"></a-sphere>
              <a-sphere position="0.21 0.07 0.404" scale="0.085 0.105 0.038" color="#fff"></a-sphere>
              <a-sphere position="-0.192 0.07 0.433" scale="0.048 0.067 0.026" color="#121620"></a-sphere>
              <a-sphere position="0.192 0.07 0.433" scale="0.048 0.067 0.026" color="#121620"></a-sphere>
              <a-sphere position="-0.211 0.105 0.453" radius="0.018" color="white"></a-sphere>
              <a-sphere position="0.173 0.105 0.453" radius="0.018" color="white"></a-sphere>
              <a-sphere position="0 -0.165 0.392" scale="0.25 0.16 0.13" color="#f9f7f0"></a-sphere>
              <a-sphere position="0 -0.103 0.513" scale="0.112 0.075 0.062" mixin="black"></a-sphere>
              <a-entity id="happyMouth" position="0 -0.23 0.501">
                <a-torus arc="180" radius="0.09" radius-tubular="0.013" rotation="0 0 180" color="#29282a"></a-torus>
              </a-entity>
              <a-entity id="sadMouth" visible="false" position="0 -0.245 0.507">
                <a-torus arc="180" radius="0.075" radius-tubular="0.012" rotation="0 0 0" color="#29282a"></a-torus>
              </a-entity>
              <a-sphere position="-0.34 -0.15 0.31" scale="0.085 0.04 0.017" color="#ffa9b8" material="opacity: 0.76; transparent: true"></a-sphere>
              <a-sphere position="0.34 -0.15 0.31" scale="0.085 0.04 0.017" color="#ffa9b8" material="opacity: 0.76; transparent: true"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>
        <!-- Weather is around and behind the panda, not blocking its face -->
        <a-entity id="sadWeather" visible="false">
          <a-entity position="-0.63 2.65 -0.43">
            <a-sphere position="-.32 0 0" scale=".52 .32 .37" color="#69798b"></a-sphere><a-sphere position=".08 .14 0" scale=".65 .45 .41" color="#75869b"></a-sphere><a-sphere position=".50 -.02 0" scale=".48 .30 .34" color="#67778c"></a-sphere>
          </a-entity>
          <a-entity position=".7 2.91 -.8" scale=".7 .7 .7">
            <a-sphere position="-.3 0 0" scale=".48 .3 .35" color="#7c879b"></a-sphere><a-sphere position=".1 .13 0" scale=".55 .4 .38" color="#8793a5"></a-sphere><a-sphere position=".48 0 0" scale=".40 .27 .32" color="#788597"></a-sphere>
          </a-entity>
          <a-entity id="rain"></a-entity>
        </a-entity>
        <a-entity id="happyWeather">
          <a-entity id="sun" position="0.84 2.53 -0.66">
            <a-sphere radius="0.27" color="#ffdf4d" material="emissive: #ffa600; emissiveIntensity: .5"></a-sphere>
            <a-entity id="sunRays"></a-entity>
          </a-entity>
          <a-entity id="rainbow" position="-0.47 0.75 -1.06" rotation="0 0 -9"></a-entity>
          <a-sphere position="-1.0 1.2 -1.04" scale=".32 .15 .21" color="#ffffff"></a-sphere>
          <a-sphere position=".36 1.0 -1.05" scale=".33 .14 .22" color="#ffffff"></a-sphere>
        </a-entity>
      </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    (() => {
      'use strict';
      let mood = 'happy';
      let markerVisible = false;
      const byId = id => document.getElementById(id);
      const panda = byId('pandaRig');
      const head = byId('headPivot');
      const leftArm = byId('leftArm');
      const rightArm = byId('rightArm');
      const status = byId('status');
      const makeEntity = (name, attrs, parent) => {
        const el = document.createElement(name);
        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
        parent.appendChild(el);
        return el;
      };
      // Build curved rainbow with concentric, rear-facing colored arcs.
      const rainbow = byId('rainbow');
      ['#f84c52','#ff9c37','#ffe35b','#58c96d','#48a8ea','#8373e5'].forEach((color, i) => {
        makeEntity('a-torus', {
          arc: 180,
          radius: (1.31 - i * .09).toFixed(3),
          'radius-tubular': .052,
          rotation: '0 0 0',
          position: `0 0 ${-i * .009}`,
          material: `color: ${color}; shader: flat; side: double`
        }, rainbow);
      });
      const rays = byId('sunRays');
      for (let i = 0; i < 10; i++) {
        const angle = i * Math.PI * 2 / 10;
        makeEntity('a-box', {
          position: `${Math.cos(angle) * .39} ${Math.sin(angle) * .39} 0`,
          rotation: `0 0 ${i * 36 - 90}`,
          width: .055, height: .17, depth: .034,
          material: 'color: #ffe45e; shader: flat'
        }, rays);
      }
      const drops = [];
      const rain = byId('rain');
      // Deterministic positions: no rain drawn across the foreground center of the face.
      for (let i = 0; i < 70; i++) {
        const x = ((i * 37 % 101) / 100 - .5) * 3.2;
        const y = ((i * 61 % 103) / 102) * 2.4 + .25;
        const z = -.45 + ((i * 29 % 53) / 53) * .6;
        const drop = makeEntity('a-cylinder', {
          radius: .009, height: .13,
          material: 'color: #a8ddff; opacity: .79; transparent: true; shader: flat',
          position: `${x} ${y} ${z}`, rotation: '0 0 -10'
        }, rain);
        drops.push({el: drop, x, y, z, speed: 1.4 + (i % 6) * .18});
      }
      const setMood = next => {
        mood = next;
        const sad = next === 'sad';
        byId('sadWeather').setAttribute('visible', sad);
        byId('happyWeather').setAttribute('visible', !sad);
        byId('sadMouth').setAttribute('visible', sad);
        byId('happyMouth').setAttribute('visible', !sad);
        byId('sadBtn').setAttribute('aria-pressed', String(sad));
        byId('happyBtn').setAttribute('aria-pressed', String(!sad));
        if (markerVisible) status.textContent = sad ? '🐼 แพนด้ากำลังเศร้า ฝนตกแล้ว' : '🐼 แพนด้ากำลังมีความสุข!';
      };
      byId('sadBtn').addEventListener('click', () => setMood('sad'));
      byId('happyBtn').addEventListener('click', () => setMood('happy'));
      const marker = byId('hiro');
      marker.addEventListener('markerFound', () => {
        markerVisible = true;
        status.textContent = mood === 'happy' ? '🐼 พบ Hiro Marker แล้ว — แพนด้ามีความสุข!' : '🐼 พบ Hiro Marker แล้ว — แพนด้ากำลังเศร้า';
      });
      marker.addEventListener('markerLost', () => {
        markerVisible = false;
        status.textContent = '📷 เล็งกล้องไปที่ Hiro Marker เพื่อแสดงแพนด้า';
      });
      byId('hiro').addEventListener('loaded', () => {
        status.textContent = '📷 เล็งกล้องไปที่ Hiro Marker เพื่อแสดงแพนด้า';
      });
      window.addEventListener('error', (e) => {
        if (/camera|webcam|permission|NotAllowedError/i.test(String(e.message))) {
          status.textContent = 'ไม่สามารถใช้กล้องได้ — ตรวจสอบสิทธิ์กล้องและเปิดผ่าน HTTPS หรือ localhost';
        }
      });
      AFRAME.registerComponent('panda-animate', {
        tick(time, dt) {
          if (!panda || !head) return;
          const t = time / 1000;
          const dtSec = Math.min(dt / 1000 || .016, .05);
          const happy = mood === 'happy';
          const targetRot = happy ? Math.sin(t * 3.0) * 13 : Math.sin(t * 1.1) * 1.6;
          const targetHead = happy ? -4 + Math.sin(t * 2.8) * 3 : 36;
          const targetY = happy ? Math.abs(Math.sin(t * 3)) * .06 : -.085;
          const s = Math.min(1, dtSec * 5.5);
          panda.object3D.rotation.z += ((targetRot * Math.PI / 180) - panda.object3D.rotation.z) * s;
          panda.object3D.position.y += (targetY - panda.object3D.position.y) * s;
          head.object3D.rotation.x += ((targetHead * Math.PI / 180) - head.object3D.rotation.x) * s;
          leftArm.object3D.rotation.z += (((happy ? -18 + Math.sin(t*3+.6)*16 : -8) * Math.PI / 180) - leftArm.object3D.rotation.z) * s;
          rightArm.object3D.rotation.z += (((happy ? 18 - Math.sin(t*3+.6)*16 : 8) * Math.PI / 180) - rightArm.object3D.rotation.z) * s;
          if (!happy) {
            for (const d of drops) {
              d.y -= d.speed * dtSec;
              if (d.y < .14) d.y += 2.4;
              d.el.object3D.position.set(d.x, d.y, d.z);
            }
          }
          rays.object3D.rotation.z = t * .18;
        }
      });
      byId('world').setAttribute('panda-animate', '');
      setMood('happy');
    })();
  </script>
</body>
</html>
