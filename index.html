<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1f5131" />
  <title>AR Panda - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .top-card {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 16px;
      color: #fff;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,.24);
    }

    .top-card strong {
      display: block;
      font-size: 17px;
      margin-bottom: 2px;
    }

    #status {
      font-size: 13px;
      opacity: .92;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 14px;
      pointer-events: auto;
    }

    button {
      min-width: 130px;
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.28);
      transition: transform .15s ease, opacity .15s ease;
      touch-action: manipulation;
    }

    button:active { transform: scale(.96); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #feedBtn { background: #2e7d32; }
    #playBtn { background: #1565c0; }

    .hint {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,.48);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      button { min-width: 0; flex: 1; max-width: 180px; }
    }
  </style>

  <script>
    AFRAME.registerComponent('panda-controller', {
      init: function () {
        this.marker = this.el;
        this.panda = document.querySelector('#panda');
        this.bamboo = document.querySelector('#bambooGroup');
        this.ball = document.querySelector('#ball');
        this.head = document.querySelector('#pandaHead');
        this.body = document.querySelector('#pandaBody');
        this.feedBtn = document.querySelector('#feedBtn');
        this.playBtn = document.querySelector('#playBtn');
        this.status = document.querySelector('#status');
        this.visible = false;
        this.busy = false;
        this.crawlPhase = 0;

        const setButtons = (enabled) => {
          this.feedBtn.disabled = !enabled;
          this.playBtn.disabled = !enabled;
        };

        setButtons(false);

        this.marker.addEventListener('markerFound', () => {
          this.visible = true;
          setButtons(true);
          this.status.textContent = 'พบ Hiro Marker แล้ว — แพนด้ากำลังคลานเล่นบนพื้นหญ้า';
        });

        this.marker.addEventListener('markerLost', () => {
          this.visible = false;
          setButtons(false);
          this.status.textContent = 'กำลังค้นหา Hiro Marker…';
        });

        this.feedBtn.addEventListener('click', () => this.feedPanda());
        this.playBtn.addEventListener('click', () => this.playBall());
      },

      feedPanda: function () {
        if (!this.visible || this.busy) return;
        this.busy = true;
        this.status.textContent = 'ให้อาหารแล้ว — ไม้ไผ่กำลังส่งไปให้แพนด้า 🐼🎋';

        this.bamboo.setAttribute('visible', true);
        this.bamboo.setAttribute('animation__move', {
          property: 'position',
          from: '-1.35 0.28 0.35',
          to: '-0.25 0.42 0.2',
          dur: 1000,
          easing: 'easeOutQuad'
        });
        this.bamboo.setAttribute('animation__tilt', {
          property: 'rotation',
          from: '0 0 -35',
          to: '0 0 15',
          dur: 1000,
          easing: 'easeOutQuad'
        });

        this.head.setAttribute('animation__eat1', {
          property: 'rotation',
          from: '0 0 0',
          to: '18 0 0',
          dir: 'alternate',
          loop: 5,
          dur: 220,
          easing: 'easeInOutSine'
        });

        setTimeout(() => {
          this.bamboo.setAttribute('animation__out', {
            property: 'scale',
            from: '1 1 1',
            to: '0.01 0.01 0.01',
            dur: 500,
            easing: 'easeInQuad'
          });
        }, 2500);

        setTimeout(() => {
          this.bamboo.setAttribute('visible', false);
          this.bamboo.setAttribute('position', '-1.35 0.28 0.35');
          this.bamboo.setAttribute('rotation', '0 0 -35');
          this.bamboo.setAttribute('scale', '1 1 1');
          this.bamboo.removeAttribute('animation__move');
          this.bamboo.removeAttribute('animation__tilt');
          this.bamboo.removeAttribute('animation__out');
          this.head.removeAttribute('animation__eat1');
          this.head.setAttribute('rotation', '0 0 0');
          this.status.textContent = 'แพนด้าอิ่มแล้ว! กด “เล่น” เพื่อให้ลูกบอลออกมา';
          this.busy = false;
        }, 3200);
      },

      playBall: function () {
        if (!this.visible || this.busy) return;
        this.busy = true;
        this.status.textContent = 'ลูกบอลมาแล้ว — แพนด้ากำลังเล่นบอล 🐼⚽';

        this.ball.setAttribute('visible', true);
        this.ball.setAttribute('position', '0.9 0.16 0.2');
        this.ball.setAttribute('scale', '1 1 1');

        this.ball.setAttribute('animation__roll', {
          property: 'position',
          from: '0.95 0.16 0.25',
          to: '-0.55 0.16 -0.15',
          dir: 'alternate',
          loop: 3,
          dur: 850,
          easing: 'easeInOutSine'
        });
        this.ball.setAttribute('animation__spin', {
          property: 'rotation',
          from: '0 0 0',
          to: '0 0 720',
          loop: 6,
          dur: 850,
          easing: 'linear'
        });

        this.panda.setAttribute('animation__pounce', {
          property: 'position',
          from: '0 0 0',
          to: '0.18 0 0.08',
          dir: 'alternate',
          loop: 3,
          dur: 850,
          easing: 'easeInOutSine'
        });

        setTimeout(() => {
          this.ball.setAttribute('animation__hide', {
            property: 'scale',
            from: '1 1 1',
            to: '0.01 0.01 0.01',
            dur: 450,
            easing: 'easeInQuad'
          });
        }, 5200);

        setTimeout(() => {
          this.ball.setAttribute('visible', false);
          this.ball.setAttribute('scale', '1 1 1');
          this.ball.removeAttribute('animation__roll');
          this.ball.removeAttribute('animation__spin');
          this.ball.removeAttribute('animation__hide');
          this.panda.removeAttribute('animation__pounce');
          this.panda.setAttribute('position', '0 0 0');
          this.status.textContent = 'เล่นเสร็จแล้ว — แพนด้ากลับมาคลานบนพื้นหญ้า';
          this.busy = false;
        }, 5750);
      },

      tick: function (time, delta) {
        if (!this.visible || this.busy || !this.panda) return;
        this.crawlPhase += delta * 0.002;
        const x = Math.sin(this.crawlPhase * 0.55) * 0.28;
        const z = Math.cos(this.crawlPhase * 0.42) * 0.10;
        const y = 0.02 + Math.abs(Math.sin(this.crawlPhase * 2.2)) * 0.025;
        this.panda.object3D.position.set(x, y, z);
        this.panda.object3D.rotation.y = Math.sin(this.crawlPhase * 0.55) * 0.18;
      }
    });
  </script>
</head>

<body>
  <div id="hud">
    <div class="top-card">
      <strong>AR Panda Playground</strong>
      <div id="status">กำลังค้นหา Hiro Marker…</div>
    </div>

    <div class="hint">อนุญาตใช้กล้อง แล้วหันกล้องไปที่ Hiro Marker</div>

    <div class="controls">
      <button id="feedBtn" type="button" disabled>🎋 ให้อาหาร</button>
      <button id="playBtn" type="button" disabled>⚽ เล่น</button>
    </div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5;"
  >
    <a-assets></a-assets>

    <a-marker preset="hiro" panda-controller>
      <!-- พื้นหญ้า -->
      <a-cylinder position="0 -0.035 0" radius="1.45" height="0.07" color="#5FAE48" segments-radial="48"></a-cylinder>
      <a-cylinder position="0 -0.078 0" radius="1.30" height="0.04" color="#3C7A32" segments-radial="48"></a-cylinder>

      <!-- กอหญ้ารอบๆ -->
      <a-entity position="0 0 0">
        <a-cone position="-0.92 0.09 -0.55" radius-bottom="0.05" radius-top="0" height="0.24" color="#3C8A3E"></a-cone>
        <a-cone position="-0.76 0.08 -0.65" radius-bottom="0.045" radius-top="0" height="0.20" color="#4B9C45"></a-cone>
        <a-cone position="0.95 0.08 -0.42" radius-bottom="0.05" radius-top="0" height="0.22" color="#3C8A3E"></a-cone>
        <a-cone position="0.72 0.08 0.70" radius-bottom="0.045" radius-top="0" height="0.22" color="#4B9C45"></a-cone>
        <a-cone position="-0.82 0.08 0.63" radius-bottom="0.05" radius-top="0" height="0.22" color="#3C8A3E"></a-cone>
      </a-entity>

      <!-- Panda แบบ low-poly / ตุ๊กตา -->
      <a-entity id="panda" position="0 0 0" rotation="0 0 0" scale="0.95 0.95 0.95">
        <a-entity id="pandaBody">
          <!-- ลำตัวนอนคลาน -->
          <a-sphere position="0 0.40 0" radius="0.40" scale="1.18 0.72 0.88" color="#F7F7F7"></a-sphere>
          <a-sphere position="-0.20 0.39 0" radius="0.27" scale="0.92 0.80 0.95" color="#111111"></a-sphere>

          <!-- ขา -->
          <a-capsule position="-0.26 0.21 0.28" radius="0.10" height="0.30" rotation="90 0 18" color="#111111"></a-capsule>
          <a-capsule position="-0.26 0.21 -0.28" radius="0.10" height="0.30" rotation="90 0 -18" color="#111111"></a-capsule>
          <a-capsule position="0.28 0.22 0.27" radius="0.10" height="0.30" rotation="90 0 -18" color="#111111"></a-capsule>
          <a-capsule position="0.28 0.22 -0.27" radius="0.10" height="0.30" rotation="90 0 18" color="#111111"></a-capsule>
        </a-entity>

        <!-- หัว -->
        <a-entity id="pandaHead" position="0.43 0.54 0">
          <a-sphere radius="0.31" color="#FCFCFC"></a-sphere>

          <!-- หู -->
          <a-sphere position="-0.12 0.24 0.20" radius="0.11" color="#111111"></a-sphere>
          <a-sphere position="-0.12 0.24 -0.20" radius="0.11" color="#111111"></a-sphere>

          <!-- ปื้นตา -->
          <a-sphere position="0.23 0.07 0.13" radius="0.092" scale="0.55 1.15 1" color="#111111"></a-sphere>
          <a-sphere position="0.23 0.07 -0.13" radius="0.092" scale="0.55 1.15 1" color="#111111"></a-sphere>

          <!-- ตา -->
          <a-sphere position="0.283 0.08 0.13" radius="0.028" color="#FFFFFF"></a-sphere>
          <a-sphere position="0.283 0.08 -0.13" radius="0.028" color="#FFFFFF"></a-sphere>
          <a-sphere position="0.305 0.08 0.13" radius="0.012" color="#222222"></a-sphere>
          <a-sphere position="0.305 0.08 -0.13" radius="0.012" color="#222222"></a-sphere>

          <!-- จมูก + ปาก -->
          <a-sphere position="0.30 -0.06 0" radius="0.055" scale="0.72 0.62 1" color="#101010"></a-sphere>
          <a-torus position="0.304 -0.12 0" rotation="0 90 0" radius="0.055" radius-tubular="0.012" arc="180" color="#333333"></a-torus>
        </a-entity>
      </a-entity>

      <!-- ไม้ไผ่สำหรับปุ่มให้อาหาร -->
      <a-entity id="bambooGroup" visible="false" position="-1.35 0.28 0.35" rotation="0 0 -35">
        <a-cylinder radius="0.035" height="0.75" color="#67A844"></a-cylinder>
        <a-cylinder position="0 0.16 0" radius="0.039" height="0.025" color="#3F7C2D"></a-cylinder>
        <a-cylinder position="0 -0.17 0" radius="0.039" height="0.025" color="#3F7C2D"></a-cylinder>
        <a-sphere position="0.11 0.16 0" radius="0.11" scale="1.3 0.35 0.55" rotation="0 0 28" color="#4C9C3D"></a-sphere>
        <a-sphere position="-0.10 -0.05 0" radius="0.10" scale="1.25 0.32 0.52" rotation="0 0 -28" color="#4C9C3D"></a-sphere>
      </a-entity>

      <!-- ลูกบอลสำหรับปุ่มเล่น -->
      <a-entity id="ball" visible="false" position="0.9 0.16 0.2">
        <a-sphere radius="0.16" color="#F44336"></a-sphere>
        <a-torus radius="0.11" radius-tubular="0.018" color="#FFFFFF" rotation="90 0 0"></a-torus>
        <a-torus radius="0.11" radius-tubular="0.018" color="#FFFFFF" rotation="0 90 0"></a-torus>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
