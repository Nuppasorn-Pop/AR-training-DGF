<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#17251b" />
  <title>Panda Hiro AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #000;
    }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }
    .title {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(17, 28, 20, .78);
      color: #fff;
      text-align: center;
      font-size: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 22px rgba(0,0,0,.25);
    }
    .title strong {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }
    .status {
      position: absolute;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.9);
      color: #1d3322;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      min-width: 132px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
      touch-action: manipulation;
    }
    #feedBtn { background: #268a48; }
    #playBtn { background: #e17d24; }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .note {
      position: absolute;
      bottom: 86px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,.55);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 11px;
      white-space: nowrap;
    }
    @media (max-width: 420px) {
      .controls { gap: 8px; width: 94%; }
      button { flex: 1; min-width: 0; padding: 12px 10px; }
    }
  </style>

  <script>
    AFRAME.registerComponent('panda-idle', {
      init: function () {
        this.t = 0;
        this.baseY = this.el.object3D.position.y;
      },
      tick: function (time, delta) {
        this.t += delta / 1000;
        if (this.el.getAttribute('data-busy') === 'true') return;
        this.el.object3D.position.y = this.baseY + Math.sin(this.t * 2.2) * 0.015;
        this.el.object3D.rotation.z = Math.sin(this.t * 1.5) * 0.025;
      }
    });
  </script>
</head>

<body>
  <div class="hud">
    <div class="title">
      <strong>🐼 Panda AR Garden</strong>
      หันกล้องไปที่ Hiro Marker แล้วทักทายแพนด้าน้อย
    </div>
    <div class="status" id="status">กำลังรอ Hiro Marker…</div>
    <div class="note">กล้องต้องได้รับอนุญาต และควรเปิดผ่าน HTTPS หรือ localhost</div>
    <div class="controls">
      <button id="feedBtn" disabled>🎋 ให้อาหาร</button>
      <button id="playBtn" disabled>⚽ เล่นกับแพนด้า</button>
    </div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.75;"
  >
    <a-assets></a-assets>

    <a-marker preset="hiro" id="hiroMarker" emitevents="true">
      <!-- Scene is rotated so the panda's face is aimed toward the camera side of the marker. -->
      <a-entity id="world" rotation="0 0 0">

        <!-- Grass base -->
        <a-cylinder
          position="0 0.025 0"
          radius="0.82"
          height="0.05"
          color="#68a94d"
          roughness="1"
        ></a-cylinder>
        <a-cylinder
          position="0 0.055 0"
          radius="0.72"
          height="0.025"
          color="#86c85e"
          roughness="1"
        ></a-cylinder>

        <!-- Small grass tufts -->
        <a-entity position="-0.55 0.12 -0.18" rotation="0 0 -8">
          <a-cone radius-bottom="0.025" radius-top="0" height="0.18" color="#397b37"></a-cone>
          <a-cone position="0.05 0 0.02" rotation="0 0 18" radius-bottom="0.022" radius-top="0" height="0.16" color="#4d9145"></a-cone>
        </a-entity>
        <a-entity position="0.55 0.12 0.12" rotation="0 0 8">
          <a-cone radius-bottom="0.025" radius-top="0" height="0.18" color="#397b37"></a-cone>
          <a-cone position="-0.05 0 0.02" rotation="0 0 -18" radius-bottom="0.022" radius-top="0" height="0.16" color="#4d9145"></a-cone>
        </a-entity>

        <!-- PANDA: low/crawling pose; face toward +Z -->
        <a-entity id="panda" panda-idle position="0 0.20 0.02" data-busy="false">

          <!-- Body -->
          <a-sphere position="0 0.15 -0.14" scale="0.38 0.25 0.48" color="#f4f2e9" roughness="0.85"></a-sphere>
          <a-sphere position="0 0.17 -0.02" scale="0.31 0.24 0.31" color="#f8f6ef" roughness="0.85"></a-sphere>

          <!-- Head -->
          <a-sphere position="0 0.37 0.22" scale="0.29 0.28 0.27" color="#faf8f1" roughness="0.8"></a-sphere>

          <!-- Ears -->
          <a-sphere position="-0.205 0.555 0.205" scale="0.095 0.10 0.065" color="#151515"></a-sphere>
          <a-sphere position="0.205 0.555 0.205" scale="0.095 0.10 0.065" color="#151515"></a-sphere>

          <!-- Eye patches -->
          <a-sphere position="-0.105 0.405 0.438" rotation="-8 0 -18" scale="0.083 0.105 0.035" color="#171717"></a-sphere>
          <a-sphere position="0.105 0.405 0.438" rotation="-8 0 18" scale="0.083 0.105 0.035" color="#171717"></a-sphere>

          <!-- Eyes -->
          <a-sphere position="-0.09 0.418 0.469" scale="0.027 0.035 0.018" color="#ffffff"></a-sphere>
          <a-sphere position="0.09 0.418 0.469" scale="0.027 0.035 0.018" color="#ffffff"></a-sphere>
          <a-sphere position="-0.084 0.414 0.484" scale="0.013 0.017 0.012" color="#242424"></a-sphere>
          <a-sphere position="0.084 0.414 0.484" scale="0.013 0.017 0.012" color="#242424"></a-sphere>

          <!-- Muzzle / nose / smile -->
          <a-sphere position="0 0.335 0.475" scale="0.11 0.07 0.045" color="#fffdf7"></a-sphere>
          <a-sphere position="0 0.36 0.515" scale="0.042 0.028 0.022" color="#121212"></a-sphere>
          <a-torus position="0 0.31 0.507" rotation="90 0 0" radius="0.045" radius-tubular="0.008"
                   arc="180" color="#2a1b1b"></a-torus>

          <!-- Cheeks -->
          <a-sphere position="-0.155 0.325 0.463" scale="0.038 0.022 0.014" color="#f0a6a6"></a-sphere>
          <a-sphere position="0.155 0.325 0.463" scale="0.038 0.022 0.014" color="#f0a6a6"></a-sphere>

          <!-- Crawling legs -->
          <a-capsule position="-0.25 0.08 0.16" rotation="88 0 22" radius="0.07" height="0.20" color="#171717"></a-capsule>
          <a-capsule position="0.25 0.08 0.16" rotation="88 0 -22" radius="0.07" height="0.20" color="#171717"></a-capsule>
          <a-capsule position="-0.25 0.07 -0.28" rotation="88 0 -18" radius="0.075" height="0.21" color="#171717"></a-capsule>
          <a-capsule position="0.25 0.07 -0.28" rotation="88 0 18" radius="0.075" height="0.21" color="#171717"></a-capsule>

          <!-- tiny tail -->
          <a-sphere position="0 0.20 -0.55" scale="0.08 0.07 0.07" color="#171717"></a-sphere>
        </a-entity>

        <!-- Bamboo, hidden until feeding -->
        <a-entity id="bamboo" visible="false" position="0.55 0.18 0.48" rotation="0 0 70">
          <a-cylinder radius="0.025" height="0.46" color="#4e9c46"></a-cylinder>
          <a-torus position="0 0.10 0" rotation="90 0 0" radius="0.027" radius-tubular="0.006" color="#2f7636"></a-torus>
          <a-torus position="0 -0.10 0" rotation="90 0 0" radius="0.027" radius-tubular="0.006" color="#2f7636"></a-torus>
          <a-sphere position="0.06 0.12 0" scale="0.08 0.025 0.04" color="#66b75a"></a-sphere>
          <a-sphere position="-0.06 -0.05 0" scale="0.08 0.025 0.04" color="#66b75a"></a-sphere>
        </a-entity>

        <!-- Ball, hidden until playing -->
        <a-entity id="ball" visible="false" position="-0.55 0.16 0.38">
          <a-sphere radius="0.13" color="#ef8b32" roughness="0.6"></a-sphere>
          <a-torus rotation="90 0 0" radius="0.095" radius-tubular="0.012" color="#fff4cf"></a-torus>
          <a-torus rotation="0 90 0" radius="0.095" radius-tubular="0.012" color="#fff4cf"></a-torus>
        </a-entity>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector('#hiroMarker');
    const panda = document.querySelector('#panda');
    const bamboo = document.querySelector('#bamboo');
    const ball = document.querySelector('#ball');
    const feedBtn = document.querySelector('#feedBtn');
    const playBtn = document.querySelector('#playBtn');
    const status = document.querySelector('#status');

    let markerVisible = false;
    let busy = false;

    marker.addEventListener('markerFound', () => {
      markerVisible = true;
      feedBtn.disabled = false;
      playBtn.disabled = false;
      status.textContent = 'พบ Hiro Marker แล้ว 🐼';
    });

    marker.addEventListener('markerLost', () => {
      markerVisible = false;
      feedBtn.disabled = true;
      playBtn.disabled = true;
      status.textContent = 'กำลังรอ Hiro Marker…';
    });

    function setBusy(value) {
      busy = value;
      panda.setAttribute('data-busy', value ? 'true' : 'false');
      feedBtn.disabled = value || !markerVisible;
      playBtn.disabled = value || !markerVisible;
    }

    function clearAnimations(el) {
      ['animation__a','animation__b','animation__c','animation__d','animation__e']
        .forEach(a => el.removeAttribute(a));
    }

    feedBtn.addEventListener('click', () => {
      if (busy || !markerVisible) return;
      setBusy(true);
      status.textContent = 'แพนด้ากำลังกินไม้ไผ่ 🎋';

      clearAnimations(bamboo);
      clearAnimations(panda);
      bamboo.setAttribute('visible', true);
      bamboo.setAttribute('position', '0.58 0.20 0.48');
      bamboo.setAttribute('rotation', '0 0 70');

      bamboo.setAttribute('animation__a',
        'property: position; to: 0.15 0.35 0.46; dur: 900; easing: easeOutQuad');
      bamboo.setAttribute('animation__b',
        'property: rotation; to: 0 0 35; dur: 900; easing: easeOutQuad');

      setTimeout(() => {
        panda.setAttribute('animation__a',
          'property: rotation; from: 0 0 -3; to: 0 0 3; dur: 250; dir: alternate; loop: 5; easing: easeInOutSine');
        bamboo.setAttribute('animation__c',
          'property: position; from: 0.15 0.35 0.46; to: 0.12 0.32 0.44; dur: 220; dir: alternate; loop: 6');
      }, 950);

      setTimeout(() => {
        bamboo.setAttribute('animation__d',
          'property: scale; from: 1 1 1; to: 0.15 0.15 0.15; dur: 800; easing: easeInQuad');
      }, 2300);

      setTimeout(() => {
        bamboo.setAttribute('visible', false);
        bamboo.setAttribute('scale', '1 1 1');
        clearAnimations(bamboo);
        clearAnimations(panda);
        panda.setAttribute('rotation', '0 0 0');
        status.textContent = markerVisible ? 'อร่อยมาก! 🐼💚' : 'กำลังรอ Hiro Marker…';
        setBusy(false);
      }, 3300);
    });

    playBtn.addEventListener('click', () => {
      if (busy || !markerVisible) return;
      setBusy(true);
      status.textContent = 'แพนด้ากำลังเล่นบอล ⚽';

      clearAnimations(ball);
      clearAnimations(panda);
      ball.setAttribute('visible', true);
      ball.setAttribute('position', '-0.58 0.16 0.40');
      ball.setAttribute('rotation', '0 0 0');

      ball.setAttribute('animation__a',
        'property: position; from: -0.58 0.16 0.40; to: 0.45 0.16 0.42; dur: 900; dir: alternate; loop: 3; easing: easeInOutQuad');
      ball.setAttribute('animation__b',
        'property: rotation; from: 0 0 0; to: 360 720 360; dur: 900; dir: alternate; loop: 3; easing: linear');

      panda.setAttribute('animation__a',
        'property: position; from: 0 0.20 0.02; to: 0.10 0.25 0.03; dur: 450; dir: alternate; loop: 6; easing: easeInOutSine');
      panda.setAttribute('animation__b',
        'property: rotation; from: 0 0 -5; to: 0 0 5; dur: 450; dir: alternate; loop: 6; easing: easeInOutSine');

      setTimeout(() => {
        ball.setAttribute('visible', false);
        clearAnimations(ball);
        clearAnimations(panda);
        panda.setAttribute('position', '0 0.20 0.02');
        panda.setAttribute('rotation', '0 0 0');
        status.textContent = markerVisible ? 'เล่นสนุกจัง! 🐼⚽' : 'กำลังรอ Hiro Marker…';
        setBusy(false);
      }, 3100);
    });

    // Helpful message if the browser blocks camera permission.
    window.addEventListener('load', () => {
      setTimeout(() => {
        const video = document.querySelector('video');
        if (!video || video.readyState < 2) {
          status.textContent = 'หากกล้องไม่เปิด ให้ตรวจ Camera permission และใช้ HTTPS/localhost';
        }
      }, 5000);
    });
  </script>
</body>
</html>
