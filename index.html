<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Cute Panda - Hiro Marker</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #000;
    }

    .ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 9999;
      display: flex;
      justify-content: center;
      gap: 14px;
      pointer-events: none;
    }

    .ui button {
      pointer-events: auto;
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
      transition: transform .15s ease, opacity .15s ease;
      color: #fff;
    }

    .ui button:active {
      transform: scale(.94);
    }

    #feedBtn {
      background: linear-gradient(135deg, #33a852, #1d7f3b);
    }

    #playBtn {
      background: linear-gradient(135deg, #ff8a00, #ff5f00);
    }

    .hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,.58);
      color: #fff;
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 14px;
      text-align: center;
      max-width: calc(100vw - 30px);
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    #status {
      position: fixed;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(255,255,255,.9);
      color: #222;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s ease;
    }

    #status.show {
      opacity: 1;
    }
  </style>

  <script>
    AFRAME.registerComponent('look-at-camera-y', {
      tick: function () {
        const cam = document.querySelector('[camera]');
        if (!cam) return;
        const camPos = new THREE.Vector3();
        cam.object3D.getWorldPosition(camPos);

        const objPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(objPos);

        const dx = camPos.x - objPos.x;
        const dz = camPos.z - objPos.z;
        this.el.object3D.rotation.y = Math.atan2(dx, dz);
      }
    });

    AFRAME.registerComponent('panda-breathe', {
      init: function () {
        this.baseY = this.el.object3D.position.y;
        this.t = 0;
      },
      tick: function (time, delta) {
        this.t += delta / 1000;
        this.el.object3D.position.y = this.baseY + Math.sin(this.t * 2.1) * 0.012;
      }
    });

    AFRAME.registerComponent('ball-bounce', {
      schema: { active: { default: false } },
      init: function () {
        this.t = 0;
        this.start = this.el.object3D.position.clone();
      },
      tick: function (time, delta) {
        if (!this.data.active) return;
        this.t += delta / 1000;
        const t = this.t;
        this.el.object3D.position.x = this.start.x + Math.sin(t * 2.6) * 0.55;
        this.el.object3D.position.z = this.start.z + Math.cos(t * 1.7) * 0.20;
        this.el.object3D.position.y = this.start.y + Math.abs(Math.sin(t * 4.2)) * 0.34;
        this.el.object3D.rotation.x += 0.06;
        this.el.object3D.rotation.z += 0.08;
      }
    });
  </script>
</head>

<body>
  <div class="hint">ส่องกล้องไปที่ Hiro Marker เพื่อเรียกแพนด้า 🐼</div>
  <div id="status"></div>

  <div class="ui">
    <button id="feedBtn">🎋 ให้อาหาร</button>
    <button id="playBtn">⚽ เล่น</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >
    <a-assets>
      <a-mixin id="whiteMat" material="color:#fffaf6; roughness:0.9;"></a-mixin>
      <a-mixin id="blackMat" material="color:#121212; roughness:0.8;"></a-mixin>
      <a-mixin id="pinkMat" material="color:#f6a7b8; roughness:0.7;"></a-mixin>
      <a-mixin id="greenMat" material="color:#58b957; roughness:0.85;"></a-mixin>
    </a-assets>

    <a-marker preset="hiro" id="hiroMarker">

      <!-- ฐานสนามหญ้า -->
      <a-cylinder
        position="0 0 0"
        radius="1.15"
        height="0.035"
        color="#7fcf65"
        material="roughness:1;">
      </a-cylinder>

      <!-- ดอกไม้ตกแต่ง -->
      <a-entity position="-0.78 0.06 -0.48">
        <a-cylinder radius="0.018" height="0.18" color="#4f9f4b"></a-cylinder>
        <a-sphere position="0 0.12 0" radius="0.05" color="#ffd84c"></a-sphere>
        <a-sphere position="0.045 0.12 0" radius="0.035" color="#ff8db6"></a-sphere>
        <a-sphere position="-0.045 0.12 0" radius="0.035" color="#ff8db6"></a-sphere>
      </a-entity>

      <a-entity position="0.82 0.06 -0.36" scale="0.9 0.9 0.9">
        <a-cylinder radius="0.018" height="0.18" color="#4f9f4b"></a-cylinder>
        <a-sphere position="0 0.12 0" radius="0.05" color="#ffd84c"></a-sphere>
        <a-sphere position="0.045 0.12 0" radius="0.035" color="#a78bfa"></a-sphere>
        <a-sphere position="-0.045 0.12 0" radius="0.035" color="#a78bfa"></a-sphere>
      </a-entity>

      <!-- PANDA -->
      <a-entity id="panda" position="0 0.12 0" panda-breathe look-at-camera-y>

        <!-- ลำตัว -->
        <a-sphere
          position="0 0.44 0"
          scale="0.42 0.50 0.35"
          mixin="whiteMat">
        </a-sphere>

        <!-- ท้อง -->
        <a-sphere
          position="0 0.42 0.29"
          scale="0.28 0.34 0.08"
          color="#fffefb">
        </a-sphere>

        <!-- ขาหลัง -->
        <a-sphere position="-0.24 0.20 0.06" scale="0.20 0.16 0.18" mixin="blackMat"></a-sphere>
        <a-sphere position="0.24 0.20 0.06" scale="0.20 0.16 0.18" mixin="blackMat"></a-sphere>

        <!-- เท้า -->
        <a-sphere position="-0.27 0.15 0.25" scale="0.15 0.10 0.19" mixin="blackMat"></a-sphere>
        <a-sphere position="0.27 0.15 0.25" scale="0.15 0.10 0.19" mixin="blackMat"></a-sphere>

        <!-- แขน -->
        <a-sphere position="-0.34 0.47 0.12" scale="0.13 0.30 0.13" rotation="0 0 -24" mixin="blackMat"></a-sphere>
        <a-sphere position="0.34 0.47 0.12" scale="0.13 0.30 0.13" rotation="0 0 24" mixin="blackMat"></a-sphere>

        <!-- หัว -->
        <a-sphere
          position="0 0.89 0.03"
          scale="0.46 0.43 0.40"
          mixin="whiteMat">
        </a-sphere>

        <!-- หู -->
        <a-sphere position="-0.31 1.18 0.01" radius="0.17" mixin="blackMat"></a-sphere>
        <a-sphere position="0.31 1.18 0.01" radius="0.17" mixin="blackMat"></a-sphere>

        <!-- แผ่นตาดำ -->
        <a-sphere position="-0.19 0.96 0.35" scale="0.16 0.20 0.06" rotation="0 0 -18" mixin="blackMat"></a-sphere>
        <a-sphere position="0.19 0.96 0.35" scale="0.16 0.20 0.06" rotation="0 0 18" mixin="blackMat"></a-sphere>

        <!-- ตา -->
        <a-sphere position="-0.17 0.98 0.405" radius="0.052" color="#ffffff"></a-sphere>
        <a-sphere position="0.17 0.98 0.405" radius="0.052" color="#ffffff"></a-sphere>
        <a-sphere position="-0.17 0.985 0.448" radius="0.026" color="#111111"></a-sphere>
        <a-sphere position="0.17 0.985 0.448" radius="0.026" color="#111111"></a-sphere>
        <a-sphere position="-0.158 1.005 0.47" radius="0.010" color="#ffffff"></a-sphere>
        <a-sphere position="0.182 1.005 0.47" radius="0.010" color="#ffffff"></a-sphere>

        <!-- แก้ม -->
        <a-sphere position="-0.29 0.84 0.36" scale="0.09 0.05 0.025" mixin="pinkMat"></a-sphere>
        <a-sphere position="0.29 0.84 0.36" scale="0.09 0.05 0.025" mixin="pinkMat"></a-sphere>

        <!-- จมูก -->
        <a-sphere position="0 0.84 0.42" scale="0.07 0.045 0.035" color="#151515"></a-sphere>

        <!-- ปาก -->
        <a-torus
          position="0 0.76 0.425"
          radius="0.075"
          radius-tubular="0.012"
          arc="180"
          rotation="0 0 180"
          color="#202020">
        </a-torus>

        <!-- ไม้ไผ่สำหรับ animation -->
        <a-entity id="bamboo" visible="false" position="0.88 0.47 0.38" rotation="0 0 78">
          <a-cylinder radius="0.045" height="0.62" color="#58b957"></a-cylinder>
          <a-torus position="0 0.15 0" radius="0.047" radius-tubular="0.012" rotation="90 0 0" color="#3f9445"></a-torus>
          <a-torus position="0 -0.12 0" radius="0.047" radius-tubular="0.012" rotation="90 0 0" color="#3f9445"></a-torus>
          <a-sphere position="0.12 0.08 0" scale="0.16 0.04 0.08" color="#72cf6b" rotation="0 0 35"></a-sphere>
          <a-sphere position="-0.12 -0.04 0" scale="0.16 0.04 0.08" color="#72cf6b" rotation="0 0 -35"></a-sphere>
        </a-entity>

        <!-- ลูกบอล -->
        <a-sphere
          id="ball"
          visible="false"
          position="0.72 0.18 0.35"
          radius="0.15"
          color="#ff5f5f"
          ball-bounce="active:false">
          <a-ring radius-inner="0.10" radius-outer="0.13" color="#ffd23f" rotation="90 0 0"></a-ring>
        </a-sphere>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const feedBtn = document.getElementById('feedBtn');
    const playBtn = document.getElementById('playBtn');
    const bamboo = document.getElementById('bamboo');
    const ball = document.getElementById('ball');
    const panda = document.getElementById('panda');
    const marker = document.getElementById('hiroMarker');
    const status = document.getElementById('status');

    let markerVisible = false;
    let feedTimer = null;
    let playTimer = null;

    function showStatus(text) {
      status.textContent = text;
      status.classList.add('show');
      clearTimeout(showStatus.timer);
      showStatus.timer = setTimeout(() => status.classList.remove('show'), 1800);
    }

    marker.addEventListener('markerFound', () => {
      markerVisible = true;
      showStatus('พบ Hiro Marker แล้ว 🐼');
    });

    marker.addEventListener('markerLost', () => {
      markerVisible = false;
    });

    feedBtn.addEventListener('click', () => {
      if (!markerVisible) {
        showStatus('กรุณาส่องกล้องไปที่ Hiro Marker ก่อน');
        return;
      }

      clearTimeout(feedTimer);
      bamboo.setAttribute('visible', true);

      bamboo.removeAttribute('animation__feed');
      bamboo.setAttribute('position', '0.88 0.47 0.38');

      requestAnimationFrame(() => {
        bamboo.setAttribute(
          'animation__feed',
          'property: position; from: 0.88 0.47 0.38; to: 0.16 0.72 0.43; dur: 850; easing: easeOutQuad'
        );
      });

      panda.removeAttribute('animation__happy');
      panda.setAttribute(
        'animation__happy',
        'property: rotation; from: 0 0 0; to: 0 0 5; dir: alternate; loop: 6; dur: 140; easing: easeInOutSine'
      );

      showStatus('อร่อยมาก! 🎋');

      feedTimer = setTimeout(() => {
        bamboo.setAttribute('visible', false);
        bamboo.removeAttribute('animation__feed');
        panda.removeAttribute('animation__happy');
        panda.setAttribute('rotation', '0 0 0');
      }, 3600);
    });

    playBtn.addEventListener('click', () => {
      if (!markerVisible) {
        showStatus('กรุณาส่องกล้องไปที่ Hiro Marker ก่อน');
        return;
      }

      clearTimeout(playTimer);
      ball.setAttribute('visible', true);
      ball.setAttribute('ball-bounce', 'active:true');

      panda.removeAttribute('animation__play');
      panda.setAttribute(
        'animation__play',
        'property: rotation; from: 0 -8 0; to: 0 8 0; dir: alternate; loop: 12; dur: 180; easing: easeInOutSine'
      );

      showStatus('เล่นบอลกัน! ⚽');

      playTimer = setTimeout(() => {
        ball.setAttribute('ball-bounce', 'active:false');
        ball.setAttribute('visible', false);
        ball.object3D.position.set(0.72, 0.18, 0.35);
        panda.removeAttribute('animation__play');
        panda.setAttribute('rotation', '0 0 0');
      }, 6000);
    });
  </script>
</body>
</html>
