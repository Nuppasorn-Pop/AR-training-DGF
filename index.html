<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Rocket - Hiro Marker</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    .ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      z-index: 9999;
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
    }

    .ui button {
      pointer-events: auto;
      min-width: 140px;
      padding: 14px 18px;
      border: 0;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      transition: transform .15s ease, opacity .15s ease;
    }

    .ui button:active {
      transform: scale(.96);
    }

    #launchBtn {
      background: #ff5a36;
      color: #fff;
    }

    #resetBtn {
      background: #ffffff;
      color: #222;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,.65);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      text-align: center;
      max-width: calc(100vw - 24px);
      pointer-events: none;
    }
  </style>

  <script>
    AFRAME.registerComponent('rocket-controller', {
      init: function () {
        this.baseY = 0.85;
        this.maxY = 7.5;
        this.duration = 3200;
        this.returnDuration = 2200;
        this.isLaunching = false;
        this.isReturning = false;

        this.rocket = this.el;
        this.flame = this.el.querySelector('#rocketFlame');
        this.smoke = this.el.querySelector('#rocketSmoke');

        this.launch = this.launch.bind(this);
        this.reset = this.reset.bind(this);

        window.addEventListener('rocket-launch', this.launch);
        window.addEventListener('rocket-reset', this.reset);
      },

      remove: function () {
        window.removeEventListener('rocket-launch', this.launch);
        window.removeEventListener('rocket-reset', this.reset);
      },

      launch: function () {
        if (this.isLaunching) return;

        this.isLaunching = true;
        this.isReturning = false;

        this.rocket.removeAttribute('animation__return');

        this.rocket.setAttribute('animation__launch', {
          property: 'position',
          to: `0 ${this.maxY} 0`,
          dur: this.duration,
          easing: 'easeInCubic'
        });

        this.rocket.setAttribute('animation__tilt', {
          property: 'rotation',
          from: '0 0 0',
          to: '-4 0 3',
          dur: 700,
          dir: 'alternate',
          loop: true,
          easing: 'easeInOutSine'
        });

        if (this.flame) {
          this.flame.setAttribute('visible', true);
          this.flame.setAttribute('animation__flame', {
            property: 'scale',
            from: '1 1 1',
            to: '1.25 1.8 1.25',
            dur: 130,
            dir: 'alternate',
            loop: true,
            easing: 'linear'
          });
        }

        if (this.smoke) {
          this.smoke.setAttribute('visible', true);
          this.smoke.setAttribute('animation__smoke', {
            property: 'scale',
            from: '0.7 0.7 0.7',
            to: '1.8 1.8 1.8',
            dur: 700,
            dir: 'alternate',
            loop: true,
            easing: 'easeOutQuad'
          });
        }

        setStatus('🚀 จรวดกำลังทะยานขึ้นฟ้า');

        setTimeout(() => {
          this.isLaunching = false;
          setStatus('🚀 จรวดอยู่เหนือฐาน กด Reset เพื่อกลับลงมา');
        }, this.duration);
      },

      reset: function () {
        this.isLaunching = false;
        this.isReturning = true;

        this.rocket.removeAttribute('animation__launch');
        this.rocket.removeAttribute('animation__tilt');

        this.rocket.setAttribute('animation__return', {
          property: 'position',
          to: `0 ${this.baseY} 0`,
          dur: this.returnDuration,
          easing: 'easeOutCubic'
        });

        this.rocket.setAttribute('rotation', '0 0 0');

        if (this.flame) {
          this.flame.removeAttribute('animation__flame');
          this.flame.setAttribute('visible', false);
          this.flame.setAttribute('scale', '1 1 1');
        }

        if (this.smoke) {
          this.smoke.removeAttribute('animation__smoke');
          this.smoke.setAttribute('visible', false);
          this.smoke.setAttribute('scale', '1 1 1');
        }

        setStatus('↩️ จรวดกำลังบินกลับสู่ฐาน');

        setTimeout(() => {
          this.isReturning = false;
          setStatus('✅ จรวดกลับสู่ฐานแล้ว');
        }, this.returnDuration);
      }
    });

    function setStatus(text) {
      const el = document.getElementById('status');
      if (el) el.textContent = text;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('a-marker');

      marker.addEventListener('markerFound', () => {
        setStatus('✅ พบ Hiro Marker แล้ว');
      });

      marker.addEventListener('markerLost', () => {
        setStatus('🔎 กรุณาหันกล้องไปที่ Hiro Marker');
      });

      document.getElementById('launchBtn').addEventListener('click', () => {
        window.dispatchEvent(new Event('rocket-launch'));
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        window.dispatchEvent(new Event('rocket-reset'));
      });
    });
  </script>
</head>

<body>
  <div id="status">🔎 กรุณาหันกล้องไปที่ Hiro Marker</div>

  <div class="ui">
    <button id="launchBtn">🚀 Launch</button>
    <button id="resetBtn">↩️ Reset</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
  >
    <a-assets>
      <a-mixin id="metal" material="metalness: 0.65; roughness: 0.25"></a-mixin>
    </a-assets>

    <a-marker preset="hiro">

      <!-- Launch Pad -->
      <a-cylinder
        position="0 0.08 0"
        radius="0.72"
        height="0.16"
        color="#4d5358"
        material="metalness: 0.7; roughness: 0.45"
      ></a-cylinder>

      <a-cylinder
        position="0 0.18 0"
        radius="0.54"
        height="0.06"
        color="#25282c"
      ></a-cylinder>

      <!-- Rocket -->
      <a-entity
        id="rocket"
        rocket-controller
        position="0 0.85 0"
        rotation="0 0 0"
      >
        <!-- Main body -->
        <a-cylinder
          position="0 0 0"
          radius="0.22"
          height="1.25"
          color="#e7edf2"
          mixin="metal"
        ></a-cylinder>

        <!-- Nose cone -->
        <a-cone
          position="0 0.82 0"
          radius-bottom="0.22"
          radius-top="0"
          height="0.55"
          color="#e94235"
          mixin="metal"
        ></a-cone>

        <!-- Window -->
        <a-cylinder
          position="0 0.24 0.205"
          rotation="90 0 0"
          radius="0.095"
          height="0.03"
          color="#45c8ff"
          material="metalness: 0.25; roughness: 0.15; emissive: #0b4e78; emissiveIntensity: 0.35"
        ></a-cylinder>

        <!-- Fins -->
        <a-box
          position="0.28 -0.42 0"
          width="0.18"
          height="0.4"
          depth="0.08"
          color="#e94235"
          rotation="0 0 -20"
        ></a-box>

        <a-box
          position="-0.28 -0.42 0"
          width="0.18"
          height="0.4"
          depth="0.08"
          color="#e94235"
          rotation="0 0 20"
        ></a-box>

        <a-box
          position="0 -0.42 0.28"
          width="0.08"
          height="0.4"
          depth="0.18"
          color="#e94235"
          rotation="20 0 0"
        ></a-box>

        <a-box
          position="0 -0.42 -0.28"
          width="0.08"
          height="0.4"
          depth="0.18"
          color="#e94235"
          rotation="-20 0 0"
        ></a-box>

        <!-- Engine -->
        <a-cylinder
          position="0 -0.71 0"
          radius="0.13"
          height="0.18"
          color="#34383d"
          mixin="metal"
        ></a-cylinder>

        <!-- Flame -->
        <a-cone
          id="rocketFlame"
          visible="false"
          position="0 -1.05 0"
          radius-bottom="0.03"
          radius-top="0.17"
          height="0.55"
          color="#ff8a00"
          material="emissive: #ff4d00; emissiveIntensity: 1.5; transparent: true; opacity: 0.95"
        ></a-cone>

        <!-- Smoke -->
        <a-sphere
          id="rocketSmoke"
          visible="false"
          position="0 -1.35 0"
          radius="0.22"
          color="#d7d7d7"
          material="transparent: true; opacity: 0.45"
        ></a-sphere>
      </a-entity>

      <!-- Ambient helper light -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.2" position="1 3 2"></a-light>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
